<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ExecLens</title>
<meta name="description" content="ExecLens turns technical status updates into executive-ready reporting, anchored to the objectives leadership actually cares about.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Boardroom: deep navy chrome, white paper, gold for structure only */
    --navy-900: #0A1727;
    --navy-800: #10243C;
    --navy-700: #17314F;
    --navy-line: #24405F;
    --navy-text: #D7E2EF;
    --navy-mute: #8EA3BC;

    --gold: #C9A34E;
    --gold-soft: #E8D6A8;

    --paper: #FFFFFF;
    --paper-2: #F6F7F9;
    --ink: #13202E;
    --ink-soft: #4E5F73;
    --line: #DDE2E8;

    --ok: #15614A;
    --ok-bg: #E2F0EA;
    --warn: #8A5A12;
    --warn-bg: #F8EEDA;
    --stop: #9E3A2B;
    --stop-bg: #F9E9E6;

    --serif: "Source Serif 4", Georgia, "Times New Roman", serif;
    --sans: "Inter Tight", -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --radius: 3px;
    --maxw: 1200px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: var(--sans);
    font-size: 15px;
    line-height: 1.55;
    color: var(--navy-text);
    background: var(--navy-900);
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, h3 { font-family: var(--serif); font-weight: 600; margin: 0; line-height: 1.18; }
  h1 { font-size: 2.3rem; letter-spacing: -0.012em; }
  h2 { font-size: 1.4rem; }
  h3 { font-size: 1.16rem; }
  p { margin: 0 0 0.75rem; }
  a { color: var(--gold); }
  button { font: inherit; cursor: pointer; }
  input, textarea, select { font: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  /* ---------- shell ---------- */
  .shell { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }
  .rail {
    background: var(--navy-800);
    border-right: 1px solid var(--navy-line);
    padding: 26px 20px;
    position: sticky; top: 0; height: 100vh;
  }
  .brand { display: flex; align-items: center; gap: 9px; margin-bottom: 30px; }
  .brand .name { font-family: var(--serif); font-size: 1.55rem; font-weight: 700; color: #fff; letter-spacing: -0.01em; }
  .brand .dot { width: 7px; height: 7px; background: var(--gold); display: inline-block; transform: translateY(5px); }
  .nav a {
    display: block; padding: 9px 11px; margin: 1px 0; border-radius: var(--radius);
    color: var(--navy-text); text-decoration: none; border-left: 2px solid transparent;
  }
  .nav a:hover { background: var(--navy-700); }
  .nav a.active { background: var(--navy-700); color: #fff; border-left-color: var(--gold); font-weight: 500; }
  .rail .foot { position: absolute; bottom: 22px; left: 20px; right: 20px; font-size: 12.5px; color: var(--navy-mute); line-height: 1.5; }
  .rail .foot button { background: none; border: none; color: var(--gold); padding: 0; text-decoration: underline; font-size: 12.5px; }
  .main { padding: 40px 44px 90px; max-width: var(--maxw); width: 100%; }

  @media (max-width: 860px) {
    .shell { grid-template-columns: 1fr; }
    .rail { position: static; height: auto; border-right: none; border-bottom: 1px solid var(--navy-line); padding: 14px 16px; }
    .brand { margin-bottom: 12px; }
    .nav { display: flex; gap: 4px; overflow-x: auto; }
    .nav a { white-space: nowrap; border-left: none; border-bottom: 2px solid transparent; }
    .nav a.active { border-left: none; border-bottom-color: var(--gold); }
    .rail .foot { display: none; }
    .main { padding: 24px 16px 60px; }
    h1 { font-size: 1.85rem; }
  }

  /* ---------- common ---------- */
  .lede { color: var(--navy-mute); font-size: 16.5px; line-height: 1.6; max-width: 60ch; margin-bottom: 28px; }
  .btn {
    display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
    border: 1px solid var(--navy-line); background: transparent; color: var(--navy-text);
    padding: 9px 15px; border-radius: var(--radius); font-weight: 500;
  }
  .btn:hover { background: var(--navy-700); color: #fff; }
  .btn.primary { background: var(--gold); border-color: var(--gold); color: #1A1204; font-weight: 600; }
  .btn.primary:hover { background: var(--gold-soft); border-color: var(--gold-soft); color: #1A1204; }
  .btn.ghost { background: transparent; }
  .btn.small { padding: 6px 11px; font-size: 13.5px; }
  .btn.danger { color: #E8A99D; border-color: var(--navy-line); }
  .btn.danger:hover { background: #3A1E19; color: #fff; }
  .btn[disabled] { opacity: .5; cursor: default; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .muted { color: var(--navy-mute); }
  .small { font-size: 13px; }

  /* paper surfaces: anything you read or type into */
  .card, .proj, .objective, .raw, .out .doc {
    background: var(--paper); color: var(--ink);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 1px 2px rgba(5, 15, 30, .28), 0 10px 26px rgba(5, 15, 30, .18);
  }
  .card { padding: 22px 24px; }
  .card h2, .card h3, .objective h3, .proj h3 { color: var(--ink); }
  .card .muted, .objective .muted, .proj .muted { color: var(--ink-soft); }

  .field { margin-bottom: 18px; }
  .field label { display: block; font-weight: 600; margin-bottom: 6px; color: var(--ink); font-size: 14px; }
  .field .hint { color: var(--ink-soft); font-size: 13px; margin-top: 6px; line-height: 1.5; }
  .field input[type=text], .field input[type=date], .field textarea, .field select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: var(--radius);
    background: var(--paper-2); color: var(--ink);
  }
  .field textarea { min-height: 96px; resize: vertical; line-height: 1.55; }
  .field input:focus, .field textarea:focus, .field select:focus {
    border-color: var(--gold); background: var(--paper); outline: none; box-shadow: 0 0 0 3px rgba(201, 163, 78, .22);
  }
  .field ::placeholder { color: #93A1B2; }

  .notice { border-left: 3px solid var(--gold); background: var(--paper); color: var(--ink); padding: 12px 15px; border-radius: 0 var(--radius) var(--radius) 0; font-size: 14px; }
  .notice.error { border-left-color: var(--stop); background: var(--stop-bg); }
  .empty {
    border: 1px dashed var(--navy-line); border-radius: var(--radius);
    padding: 34px; text-align: center; color: var(--navy-mute); background: var(--navy-800);
  }
  .pill { display: inline-block; font-size: 12.5px; padding: 2px 9px; border-radius: 2px; font-weight: 500; }
  .pill.ok { color: var(--ok); background: var(--ok-bg); }
  .pill.warn { color: var(--warn); background: var(--warn-bg); }

  /* ---------- projects ---------- */
  .hero { margin-bottom: 38px; padding-bottom: 30px; border-bottom: 1px solid var(--navy-line); }
  .hero h1 { max-width: 17ch; margin-bottom: 14px; color: #fff; }
  .projects { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .proj { padding: 20px 22px; display: flex; flex-direction: column; gap: 7px; }
  .proj .org { color: var(--ink-soft); font-size: 13px; }
  .proj h3 { margin-bottom: 1px; }
  .proj .obj-count { color: var(--ink-soft); font-size: 13px; }
  .proj .actions { margin-top: auto; padding-top: 14px; display: flex; gap: 8px; }
  .proj .btn { border-color: var(--line); color: var(--ink); }
  .proj .btn:hover { background: var(--paper-2); color: var(--ink); }
  .proj .btn.primary { color: #1A1204; border-color: var(--gold); }
  .proj .btn.primary:hover { background: var(--gold-soft); }
  .proj { position: relative; }
  .proj.demo::after {
    content: "Demo"; position: absolute; top: 14px; right: 16px;
    font-size: 11.5px; color: var(--ink-soft); background: var(--paper-2);
    border: 1px solid var(--line); padding: 1px 7px; border-radius: 2px;
  }
  .proj .org { padding-right: 58px; }

  /* ---------- editor ---------- */
  .editor-grid { display: grid; grid-template-columns: 1fr; gap: 24px; }
  .objective { padding: 18px 20px; margin-bottom: 14px; }
  .objective .head { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 12px; }
  .objective .idx { font-family: var(--serif); color: var(--ink-soft); font-size: 1.05rem; }
  .objective .btn { border-color: var(--line); color: var(--ink); }
  .objective .btn:hover { background: var(--paper-2); color: var(--ink); }
  .bv-row { display: flex; gap: 8px; align-items: flex-start; }
  .bv-row textarea { flex: 1; }
  .bv-row .btn { flex-shrink: 0; }

  /* ---------- translate ---------- */
  .translate { display: grid; grid-template-columns: minmax(300px, 430px) 1fr; gap: 28px; align-items: start; }
  @media (max-width: 1000px) { .translate { grid-template-columns: 1fr; } }
  .raw { padding: 22px 24px; }
  .raw label { color: var(--ink); }
  .raw .btn { border-color: var(--line); color: var(--ink); }
  .raw .btn:hover { background: var(--paper-2); color: var(--ink); }
  .raw .btn.primary { color: #1A1204; border-color: var(--gold); }
  .panel-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; gap: 10px; }
  .raw textarea { min-height: 320px; font-size: 14.5px; }

  /* the report: the one place that should feel printed */
  .out .doc { padding: 34px 38px 32px; border-top: 3px solid var(--gold); }
  .out .doc .doc-title { font-family: var(--serif); font-size: 1.72rem; font-weight: 700; color: var(--ink); letter-spacing: -0.01em; }
  .out .doc .period { color: var(--ink-soft); font-size: 13.5px; margin-top: 3px; }
  .out .doc .aligns { color: var(--ink-soft); font-size: 13.5px; margin-top: 6px; padding-top: 10px; border-top: 1px solid var(--line); }
  .out .objective-block { margin: 26px 0 4px; }
  .out .objective-block h3 {
    color: var(--ink); padding-bottom: 7px; margin-bottom: 10px;
    border-bottom: 1px solid var(--line);
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px; flex-wrap: wrap;
  }
  .out .objective-meta { font-family: var(--sans); font-size: 13px; display: inline-flex; gap: 9px; align-items: center; color: var(--ink-soft); }
  .out .timeline-note { color: var(--warn); font-size: 14px; margin: -2px 0 10px; }
  .out ul { margin: 0; padding-left: 21px; }
  .out li {
    margin: 11px 0; font-family: var(--serif); font-size: 16.5px; line-height: 1.62; color: var(--ink);
    max-width: 68ch;
  }
  .out li::marker { color: var(--gold); }
  .out li .status { font-family: var(--sans); font-size: 12.5px; color: var(--ink-soft); }
  .out li .status.blocked { color: var(--stop); font-weight: 600; }
  .out .section-flag { margin: 28px 0 4px; padding: 16px 18px; background: var(--warn-bg); border-radius: var(--radius); }
  .out .section-flag h3 { color: var(--warn); border: none; padding: 0; margin-bottom: 4px; display: block; }
  .out .section-flag .why { color: #7A5316; font-size: 13.5px; margin-bottom: 8px; }
  .out .section-flag li::marker { color: var(--warn); }
  .out .ask { font-family: var(--sans); font-size: 14.5px; font-weight: 600; }
  .out .cut { margin-top: 28px; padding-top: 16px; border-top: 1px solid var(--line); color: var(--ink-soft); font-size: 13.5px; }
  .out .cut strong { color: var(--ink); }
  .out .cut li { font-family: var(--sans); font-size: 13.5px; margin: 5px 0; color: var(--ink-soft); }
  .out .cut li::marker { color: var(--line); }
  .out-actions { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  details.source { margin-top: 5px; }
  details.source summary { color: var(--ink-soft); font-family: var(--sans); font-size: 12.5px; cursor: pointer; }
  details.source .src { color: var(--ink-soft); font-family: var(--sans); font-size: 13px; font-style: italic; margin-top: 5px; line-height: 1.5; }

  .reveal { animation: reveal .4s ease-out both; }
  @keyframes reveal { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .reveal { animation: none; } }
  .working { display: inline-flex; align-items: center; gap: 11px; color: var(--ink); }
  .working .spin { width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- rules ---------- */
  .rules { max-width: 74ch; }
  .rules h2 { margin: 32px 0 10px; color: #fff; }
  .rules p { color: var(--navy-text); line-height: 1.65; }
  .rules ul { padding-left: 21px; }
  .rules li { margin: 8px 0; line-height: 1.6; }
  .rules li::marker { color: var(--gold); }
  .rules strong { color: #fff; }
  .before-after { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 12px; }
  @media (max-width: 760px) { .before-after { grid-template-columns: 1fr; } }
  .before-after .box { border: 1px solid var(--navy-line); border-radius: var(--radius); padding: 16px 18px; background: var(--navy-800); font-size: 14.5px; line-height: 1.55; }
  .before-after .box.after { border-left: 2px solid var(--gold); }
  .before-after .box .tag { font-size: 12.5px; color: var(--navy-mute); margin-bottom: 7px; }
  .banned { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 10px; }
  .banned span { border: 1px solid var(--navy-line); background: var(--navy-800); padding: 4px 10px; border-radius: 2px; font-size: 13.5px; text-decoration: line-through; color: var(--navy-mute); }
</style>
</head>
<body>
<div class="shell">
  <aside class="rail">
    <div class="brand"><span class="name">ExecLens</span><span class="dot" aria-hidden="true"></span></div>
    <nav class="nav" id="nav">
      <a href="#/projects" data-route="projects">Projects</a>
      <a href="#/translate" data-route="translate">Translate</a>
      <a href="#/rules" data-route="rules">How it decides</a>
    </nav>
    <div class="foot">
      Projects are saved in this browser.<br>
      <button id="resetDemo" type="button">Restore demo projects</button>
    </div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================
   ExecLens - single page app
   ========================================================= */

const STORE_KEY = "execlens.projects.v1";
const API = "/api/translate";

/* ---------- demo data: built from public knowledge only ---------- */
const DEMO_PROJECTS = [
  {
    id: "demo-zero-trust",
    demo: true,
    name: "Zero Trust Remote Access",
    org: "Federal civilian agency",
    industry: "Government",
    cadence: "Weekly",
    mission: "Provide secure, resilient access to agency systems for every employee, from any location, without relying on legacy network infrastructure.",
    alignsTo: "OMB M-22-09 (Federal Zero Trust Strategy) and the agency's Zero Trust roadmap",
    successCriteria: "Success means staff reach email, Teams, and OneDrive without a VPN, a compromised session is cut off in near real time, and the agency can show an auditor at least one FISMA Moderate system operating securely on the internet.",
    objectives: [
      {
        id: "o1",
        title: "Replace legacy VPN with zero trust access for email, Teams, and OneDrive",
        description: "Make Microsoft 365 applications reachable directly over the internet through identity, device, and continuous access checks instead of a VPN tunnel.",
        businessValue: "Removes a single point of failure and a frequent user complaint. Staff get faster, more reliable access, and the agency reduces the attack surface a VPN exposes.",
        targetDate: "2026-12-31"
      },
      {
        id: "o2",
        title: "Adopt continuous access evaluation",
        description: "Turn on real-time re-evaluation of user sessions so access is revoked immediately when risk changes, rather than at the next login.",
        businessValue: "Shrinks the window in which a compromised account can be used. A lost laptop or a flagged account is cut off in near real time instead of hours later.",
        targetDate: "2026-11-15"
      },
      {
        id: "o3",
        title: "Meet the OMB M-22-09 zero trust mandate for at least one FISMA Moderate system",
        description: "Federal agencies are required by OMB Memorandum M-22-09 to operate at least one FISMA Moderate system securely over the internet without a VPN.",
        businessValue: "Avoids audit findings and demonstrates the agency's compliance with a government-wide mandate, which protects its credibility with oversight bodies.",
        targetDate: "2027-03-31"
      }
    ],
    sampleRaw: `- Attended the weekly CAE working group and ZT steering committee.
- Worked with the IdP team on conditional access policy tuning for the pilot group; enabled CAE on the pilot tenant and validated token revocation in the lab.
- Partnered with Network Engineering to decommission 2 of the 6 VPN concentrators in the East datacenter. Remaining 4 pending change window.
- Investigated intermittent Teams call drops reported by pilot users; root cause is MTU mismatch on the split tunnel config, fix is in CAB for next Tuesday.
- Began drafting the M-22-09 attestation package. Need the ISSO to confirm the boundary for the FISMA Moderate system before we can finalize section 3.
- Updated the Confluence runbook for the helpdesk.
- Leveraged the new Entra reporting to enable visibility into pilot sign-in health, supporting stakeholder confidence.`
  },
  {
    id: "demo-salesforce",
    demo: true,
    name: "Salesforce Consolidation",
    org: "Regional bank",
    industry: "Financial services",
    cadence: "Biweekly",
    mission: "",
    alignsTo: "Bank strategic plan, Pillar 2: one relationship, one record",
    successCriteria: "",
    objectives: [
      {
        id: "o1",
        title: "Migrate customer records from three regional CRMs into one Salesforce org",
        description: "Consolidate the customer data currently split across three systems inherited through acquisitions into a single Salesforce instance.",
        businessValue: "Relationship managers see one complete view of each customer instead of three partial ones, which means fewer missed cross-sell opportunities and fewer embarrassing duplicate outreach calls."

      {
        id: "o2",

      },
      {
        id: "o3",
        title: "Retire the three legacy CRM systems by year end",
        description: "Decommission the old platforms once data and workflows are fully migrated.",
        businessValue: "Ends roughly $400K a year in licensing and support for systems that duplicate what Salesforce does, and removes three systems from the audit scope.",
        targetDate: "2026-12-31"
      }
    ],
    sampleRaw: `- Completed ETL for Region 2 accounts and contacts (47,000 records). Dedup pass caught 3,100 duplicates against Region 1 data.
- Data quality workshop with the Region 3 ops team to map custom fields; they have 18 fields we don't have an equivalent for.
- Built the lead assignment rules in a sandbox and ran 200 test leads through; 6 misrouted due to zip code edge cases, fixing.
- Met with vendor about the Region 3 legacy contract; early termination fee is higher than expected, will need finance to weigh in.
- Started building Apex triggers for the account hierarchy sync.
- Coordinated with InfoSec on SSO integration for the Salesforce org.`
  },
  {
    id: "demo-servicenow",
    demo: true,
    name: "ServiceNow ITSM Rollout",
    org: "Regional hospital network",
    industry: "Healthcare",
    cadence: "Weekly",
    mission: "",
    alignsTo: "",
    successCriteria: "Every IT request at every site is a tracked ticket, response and resolution times are published monthly, and the top ten request types can be raised through the portal without calling the service desk.",
    objectives: [
      {
        id: "o1",
        title: "Replace email and phone based IT requests with ServiceNow ticketing for all clinical sites",
        description: "Move every IT request from ad hoc email and phone calls into a tracked ServiceNow ticket.",
        businessValue: "Clinical staff get a ticket number and a response time instead of a black hole. IT leadership can finally see how many requests come in and how long they take."
      },
      {
        id: "o2",
        title: "Report on response and resolution times against agreed service levels",
        description: "Configure service level agreements in ServiceNow and publish a monthly performance dashboard.",
        businessValue: "Gives hospital leadership a factual basis for staffing and vendor decisions, and gives IT a defensible record when service is questioned."

      {
        id: "o3",
        title: "Launch a self-service portal for the ten most common requests",
        description: "Password resets, access requests, equipment, and similar high-volume items handled through a portal with automated fulfillment where possible.",
        businessValue: "Cuts the service desk's highest-volume, lowest-value calls, freeing analysts for clinical-system issues that actually affect patient care."
      }
    ],
    sampleRaw: `- Go-live for Site 3 and Site 4 completed Monday. 412 tickets logged in the first week vs an estimated 150/week from email before.
- Configured SLA definitions for P1 through P4 and validated the timers with the CAB.
- Built the catalog items for password reset and new hire access; the access one is pending approval workflow design with HR.
- Weekly sync with the vendor PS team.
- Investigated why Site 2 nurses are still emailing instead of using the portal; turns out the link was not added to the clinical desktop image. Working with desktop engineering.

  },
  {
    id: "demo-copilot",
    demo: true,
    name: "Microsoft 365 Copilot Pilot",
    org: "Mid-size professional services firm",
    industry: "Professional services",
    cadence: "Weekly",
    mission: "",
    alignsTo: "Firm strategy 2026, Goal 3: reduce time spent on routine document work by 20%",
    successCriteria: "The pilot is a success if (A) participants report measurable time saved on document, email, and meeting work; (B) no client-confidential file is surfaced to someone without access; (C) output quality is rated acceptable by at least 80% of participants; and (D) leadership has enough evidence to make a firm-wide go or no-go decision.",

      {
        id: "o1",

        targetDate: "2026-10-31"
      },
      {
        id: "o2",
        title: "Phase 2: 450-user test across Consulting and Operations",
        description: "Scale to a representative cross-section of the firm for 60 days, with usage and satisfaction measured.",
        businessValue: "Produces the real evidence, from the firm's own staff, on whether Copilot saves enough time to justify the per-seat cost.",
        targetDate: "2027-02-28"
      },
      {
        id: "o3",
        title: "Put data protection controls in place before each phase opens",
        description: "Apply sensitivity labels and clean up over-shared sites so Copilot cannot surface files people should not see.",
        businessValue: "Prevents the most common Copilot failure: an assistant that helpfully summarizes a document its user was never supposed to open. This protects client confidentiality and the firm's reputation.",
        targetDate: ""
      }
    ],
    sampleRaw: `- Enabled Copilot licenses for the Finance cohort (48 of 50 users; 2 pending manager approval). Phase 1 officially started Monday.

/* ---------- state ---------- */
let projects = [];
projects = loadProjects();

function loadProjects() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      if (Array.isArray(parsed) && parsed.length) return parsed;
    }
  } catch (e) { /* fall through to demo */ }
  const seeded = structuredClone(DEMO_PROJECTS);
  saveProjects(seeded);
  return seeded;
}
function saveProjects(list) {
  projects = list || projects;
  try { localStorage.setItem(STORE_KEY, JSON.stringify(projects)); } catch (e) { /* storage may be unavailable */ }
}
function uid(prefix) { return prefix + "-" + Math.random().toString(36).slice(2, 8); }
function getProject(id) { return projects.find(p => p.id === id); }

/* ---------- router ---------- */
const main = document.getElementById("main");
function route() {
  const hash = location.hash || "#/projects";
  const parts = hash.replace(/^#\//, "").split("/");
  const view = parts[0] || "projects";
  const id = parts[1];
  document.querySelectorAll("#nav a").forEach(a => {
    a.classList.toggle("active", a.dataset.route === (view === "project" ? "projects" : view));
  });
  window.scrollTo(0, 0);
  if (view === "projects") return renderProjects();
  if (view === "project") return renderEditor(id);
  if (view === "translate") return renderTranslate(id);
  if (view === "rules") return renderRules();
  renderProjects();
}
window.addEventListener("hashchange", route);

/* ---------- helpers ---------- */
function esc(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}
function el(html) {
  const t = document.createElement("template");
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
/* Split pasted text into bullets. A new bullet starts at -, *, bullet char, or "1." ;
   anything else is treated as a continuation of the previous line. */
function splitBullets(raw) {
  const out = [];
  raw.split("\n").forEach(line => {
    const t = line.trim();
    if (!t) return;
    if (/^([-*\u2022\u00b7]|\d+[.)])\s+/.test(t) || !out.length) {
      out.push(t.replace(/^([-*\u2022\u00b7]|\d+[.)])\s+/, ""));
    } else {
      out[out.length - 1] += " " + t;
    }
  });
  return out;
}

function currentPeriodLabel(cadence) {
  const d = new Date();
  const fmt = (x) => x.toLocaleDateString(undefined, { month: "short", day: "numeric" });
  if (cadence === "Biweekly") {
    const s = new Date(d); s.setDate(d.getDate() - 13);
    return `${fmt(s)} to ${fmt(d)}`;
  }
  if (cadence === "Sprint") return "Current sprint";
  const s = new Date(d); s.setDate(d.getDate() - 6);
  return `${fmt(s)} to ${fmt(d)}`;
}

function renderOutput(out, p, period, r) {
  const statusLabel = (s) => {
    if (!s || s === "complete") return "";
    if (s === "blocked") return `<span class="status blocked">Blocked</span>`;
    return `<span class="status">In progress</span>`;
  };
  const bullet = (b) => `
    <li>${esc(b.text)} ${statusLabel(b.status)}
      ${b.source ? `<details class="source"><summary>What the team wrote</summary><div class="src">${esc(b.source)}</div></details>` : ""}
    </li>`;

  const fmtDate = (d) => {
    if (!d) return "";
    const dt = new Date(d + "T00:00:00");
    return isNaN(dt) ? d : dt.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
  };
  const timelinePill = (o) => {
    const obj = (p.objectives || []).find(x => x.id === o.objectiveId);
    const date = obj && obj.targetDate ? fmtDate(obj.targetDate) : "";
    const t = o.timeline || {};
    const map = { "on-track": ["ok", "On track"], "at-risk": ["warn", "At risk"], "slipped": ["warn", "Slipped"] };
    const hit = map[t.status];
    const pill = hit ? `<span class="pill ${hit[0]}" title="${esc(t.note || "")}">${hit[1]}</span>` : "";
    const due = date ? `<span class="muted small">Target ${esc(date)}</span>` : "";
    return (pill || due) ? `<span class="objective-meta">${due} ${pill}</span>` : "";
  };
  const objectiveBlocks = (r.objectives || []).filter(o => (o.bullets || []).length).map(o => `
    <div class="objective-block">
      <h3><span>${esc(o.title)}</span>${timelinePill(o)}</h3>
      ${o.timeline && o.timeline.note && o.timeline.status !== "on-track" ? `<div class="timeline-note">${esc(o.timeline.note)}</div>` : ""}
      <ul>${o.bullets.map(bullet).join("")}</ul>
    </div>`).join("");

  const asks = (r.blockersAndAsks || []);
  const askBlock = asks.length ? `
    <div class="section-flag">
      <h3>Needs leadership attention</h3>
      <ul>${asks.map(a => `<li>${esc(a.text)}${a.ask ? ` <span class="ask">Ask: ${esc(a.ask)}</span>` : ""}</li>`).join("")}</ul>
    </div>` : "";

  const off = (r.offObjective || []);
  const offBlock = off.length ? `
    <div class="section-flag">
      <h3>Doesn't tie to a stated objective</h3>
      <div class="why">Review before sending. Either it's out of scope, or the project is missing an objective.</div>
      <ul>${off.map(a => `<li>${esc(a.text)}${a.reason ? ` <span class="muted small">(${esc(a.reason)})</span>` : ""}</li>`).join("")}</ul>
    </div>` : "";

  const cut = (r.cut || []);
  const cutBlock = cut.length ? `
    <div class="cut">
      <strong>Left out of the report</strong>
      <ul>${cut.map(c => `<li>${esc(c.source)} <span>(${esc(c.reason)})</span></li>`).join("")}</ul>
    </div>` : "";

  out.innerHTML = `
    <div class="doc reveal" id="doc">
      <div class="doc-title">${esc(p.name)}</div>
      <div class="period">${esc(p.org || "")}${p.org ? ", " : ""}${esc(period)}</div>
      ${p.alignsTo ? `<div class="aligns">Aligns to ${esc(p.alignsTo)}</div>` : ""}
      ${objectiveBlocks || `<div class="muted">No bullets mapped to an objective.</div>`}
      ${askBlock}
      ${offBlock}
      ${cutBlock}
    </div>
    <div class="out-actions">
      <button type="button" class="btn small" id="copy-text">Copy as plain text</button>
      <button type="button" class="btn ghost small" id="copy-md">Copy as Markdown</button>
    </div>`;

  const toText = (md) => {
    const lines = [];
    lines.push(`${p.name} - ${period}`);
    (r.objectives || []).filter(o => (o.bullets || []).length).forEach(o => {
      lines.push("");
      const obj = (p.objectives || []).find(x => x.id === o.objectiveId);
      const tl = o.timeline && o.timeline.status && o.timeline.status !== "unknown" ? ` [${o.timeline.status.replace("-", " ")}]` : "";
      const due = obj && obj.targetDate ? ` (target ${obj.targetDate})` : "";
      lines.push((md ? `**${o.title}**` : o.title) + due + tl);
      o.bullets.forEach(b => {
        const st = b.status === "blocked" ? " (Blocked)" : b.status === "in-progress" ? " (In progress)" : "";
        lines.push(`- ${b.text}${st}`);
      });
    });
    if (asks.length) {
      lines.push(""); lines.push(md ? "**Needs leadership attention**" : "Needs leadership attention");
      asks.forEach(a => lines.push(`- ${a.text}${a.ask ? ` Ask: ${a.ask}` : ""}`));
    }
    if (off.length) {
      lines.push(""); lines.push(md ? "**Review: doesn't tie to a stated objective**" : "Review: doesn't tie to a stated objective");
      off.forEach(a => lines.push(`- ${a.text}`));
    }
    return lines.join("\n");
  };
  const copy = async (text, btn) => {
    try { await navigator.clipboard.writeText(text); const t = btn.textContent; btn.textContent = "Copied"; setTimeout(() => btn.textContent = t, 1400); }
    catch (e) { btn.textContent = "Copy failed"; }
  };
  document.getElementById("copy-text").addEventListener("click", (e) => copy(toText(false), e.currentTarget));
  document.getElementById("copy-md").addEventListener("click", (e) => copy(toText(true), e.currentTarget));
}

/* ---------- screen: rules ---------- */
function renderRules() {
  main.innerHTML = `
    <h1>How it decides</h1>
    <p class="lede">ExecLens isn't a summarizer. It applies a fixed set of editorial rules, learned from months of status reports being sent back by CIOs and their chiefs of staff, to every bullet. Here's the whole rulebook.</p>

    <div class="rules">
      <h2>Every bullet is rebuilt in this order</h2>
      <ul>
        <li><strong>What.</strong> The result or the problem, in one plain sentence. No product names, acronyms, or ticket numbers in the opening.</li>
        <li><strong>Why.</strong> Why a leader cares: what it protects, saves, unblocks, or what breaks if it slips. This comes from the objective's "why leadership cares" line, not from the model's imagination.</li>
        <li><strong>Who.</strong> The people affected, written into the sentence rather than tacked on in parentheses.</li>
        <li><strong>Status.</strong> Only for unfinished work: in progress, or blocked with what's needed. Finished work needs no label.</li>
      </ul>

      <h2>Name the risk, not the mechanism</h2>
      <p>Leadership doesn't reward you for naming the control. They react to the risk the control is supposed to stop. So "sensitive data could be exposed" replaces "DLP doesn't enforce in embedded experiences." Product and control names are dropped unless a plain phrase can't carry the meaning.</p>
      <div class="before-after">
        <div class="box"><div class="tag">Before</div>Partnered with Microsoft to investigate a persistent Copilot defect after an initial bug fix failed to resolve the issue, enabling root-cause analysis efforts.</div>
        <div class="box after"><div class="tag">After</div>A Copilot defect is still affecting users after Microsoft's first fix failed. Root-cause work is underway with Microsoft.</div>
      </div>

      <h2>Words that get removed</h2>
      <p class="muted small">They describe motion, not results. If a bullet leans on them, it's hiding the outcome.</p>
      <div class="banned">
        ${["enabling", "supporting", "partnered with", "efforts", "initiate", "leverage", "worked toward", "made headway", "assisted with", "collaborated with", "continued to"].map(w => `<span>${w}</span>`).join("")}
      </div>

      <h2>What never makes it into the report</h2>
      <ul>
        <li>Routine meeting attendance ("attended the weekly sync").</li>
        <li>Upcoming or scheduled activities. Those belong in a plan, not an accomplishment list.</li>
        <li>Internal tuning or maintenance with no impact outside the team.</li>
        <li>Documentation help, template work, and other support tasks.</li>
        <li>Anything that conveys no impact, no risk, and no decision.</li>
      </ul>
      <p class="muted small">Cut items are listed at the bottom of every report with the reason, so nothing disappears silently.</p>

      <h2>Dates and success criteria do real work</h2>
      <p>When an objective has a target date, each report says whether it's on track, at risk, or slipped, based only on what the team wrote. When a project has success criteria or a strategic goal it aligns to, those become a second source for "why it matters," phrased in leadership's own words rather than the team's.</p>

      <h2>Alignment is checked, not assumed</h2>
      <p>Every bullet is mapped to one of the project's stated objectives. A bullet that maps to nothing is set aside and flagged for review: either it's out of scope, or the project has an objective nobody wrote down. Either way, it shouldn't reach an executive unexamined.</p>

      <h2>Blockers get an ask</h2>
      <p>An open risk with no owner and no decision makes leadership wonder why it's in the report at all. Blocked items are pulled into their own section with the specific thing leadership can do. If there's nothing to decide, the report says so plainly instead of inventing an ask.</p>

      <h2>Nothing is invented</h2>
      <p>If a bullet is missing a fact the report needs, like the actual user impact or a number, ExecLens says what's missing rather than filling it in. A confident sentence built on a guess is worse than a gap.</p>
    </div>
  `;
}

/* ---------- API ---------- */
async function callApi(payload) {
  let res;
  try {
    res = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
  } catch (e) {
    throw new Error("Couldn't reach the translation service. If you're running locally, start it with `netlify dev`.");
  }
  let data = null;
  try { data = await res.json(); } catch (e) { /* non-json */ }
  if (!res.ok) {
    if (res.status === 504) {
      throw new Error("Timed out (504). The request ran past the server's limit. Try fewer bullets, or press Translate again.");
    }
    const detail = (data && data.error) ? data.error : `The translation service returned ${res.status}.`;
    throw new Error(detail);
  }
  return data;
}

/* Poll a queued translation. The work runs in a background function because a full
   report takes longer than a synchronous function is allowed to run. */
async function pollJob(jobId, onTick) {
  const started = Date.now();
  const LIMIT_MS = 4 * 60 * 1000;
  let wait = 1500;
  while (Date.now() - started < LIMIT_MS) {
    await new Promise(r => setTimeout(r, wait));
    wait = Math.min(wait + 500, 4000);
    if (onTick) onTick(Math.round((Date.now() - started) / 1000));
    let res;
    try {
      res = await callApi({ mode: "status", jobId });
    } catch (e) {
      continue; // a single failed poll shouldn't kill the job
    }
    if (res.state === "done") return res.result;
    if (res.state === "error") throw new Error(res.error || "The translation failed.");
  }
  throw new Error("The translation is taking unusually long. Check the function logs, or try again with fewer bullets.");
}
